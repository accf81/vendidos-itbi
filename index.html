<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vendidos ITBI">
<meta name="theme-color" content="#0f0f0f" id="themeColor">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Vendidos ITBI — Pandora Homes</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;700;800;900&display=swap');
:root {
  --bg:           #0f0f0f;
  --surface:      #16181d;
  --surface2:     #1c1f25;
  --surface3:     #23272e;
  --border:       rgba(255,255,255,.08);
  --text:         #eef0f3;
  --muted:        #8a9099;
  --accent:       #ff6600;
  --accent2:      #cc5200;
  --accent-pale:  rgba(255,102,0,.12);
  --success:      #22c55e;
  --warning:      #f59e0b;
  --danger:       #ef4444;
  --sep-line:     rgba(255,255,255,.16);
  --header-h:     58px;
  --radius:       10px;
  --radius-md:    8px;
  --radius-lg:    12px;
  --radius-xl:    14px;
  --shadow:       0 12px 26px -14px rgba(0,0,0,.6);
  --shadow-card:  0 1px 0 rgba(255,255,255,.04) inset, 0 12px 24px -14px rgba(0,0,0,.6);
  --shadow-btn:   0 1px 0 rgba(255,255,255,.07) inset, 0 2px 5px rgba(0,0,0,.35);
  --space-xs:     8px;
  --space-sm:     12px;
  --space-md:     16px;
  --space-lg:     20px;
  --space-xl:     24px;
  --font-brand:   'Montserrat', sans-serif;
  --font-ui:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --text-ui:      14px;
  --text-small:   12px;
}
[data-theme="light"] {
  --bg:           #eef0f6;
  --surface:      #ffffff;
  --surface2:     #f5f7fb;
  --surface3:     #e3e7f2;
  --border:       #c8d0e8;
  --text:         #1a2744;
  --muted:        #6f7a8e;
  --sep-line:     rgba(26,39,68,.12);
  --accent-pale:  rgba(255,102,0,.08);
  --shadow:       0 10px 24px -16px rgba(26,39,68,.25);
  --shadow-card:  0 1px 2px rgba(26,39,68,.06), 0 10px 24px -16px rgba(26,39,68,.25);
  --shadow-btn:   0 1px 1px rgba(26,39,68,.05), 0 1px 3px rgba(26,39,68,.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  font-size: var(--text-ui);
  line-height: 1.5;
  transition: background .2s, color .2s;
}

/* ── LOADING ───────────────────────────────── */
#loading {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
}
#loading h2 { font-size: 20px; font-weight: 600; }
#loading p  { color: var(--muted); font-size: 13px; }
.spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress-bar {
  width: 240px; height: 4px;
  background: var(--border); border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent);
  border-radius: 2px;
  transition: width .3s;
  width: 0%;
}

/* ── HEADER ────────────────────────────────── */
header svg,
.search-title svg,
.btn svg,
.add-link svg,
.btn-export svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

header {
  position: sticky; top: 0; z-index: 100;
  height: calc(var(--header-h) + env(safe-area-inset-top));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: env(safe-area-inset-top) 18px 0; gap: 12px;
  box-shadow: var(--shadow);
}
.logo {
  flex: 1;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-brand);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.logo span { color: var(--accent); }
.badge {
  font-size: 10px; font-weight: 700;
  background: var(--accent-pale);
  color: var(--accent);
  padding: 3px 8px; border-radius: 999px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.btn-icon {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: background .15s, border-color .15s;
}
.btn-icon:hover { background: var(--surface3); }

/* ── MAIN LAYOUT ───────────────────────────── */
main {
  max-width: 100%;
  margin: 0 auto;
  padding: 16px;
  display: flex; flex-direction: column; gap: 16px;
}

/* ── SEARCH PANEL ──────────────────────────── */
.search-panel {
  background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 45%, rgba(255,255,255,.012)) border-box;
  border: 1px solid transparent;
  border-radius: var(--radius-xl);
  padding: 20px;
  box-shadow: var(--shadow-card);
}
.search-title {
  font-family: var(--font-brand);
  font-size: 22px; font-weight: 700;
  letter-spacing: -.02em;
  margin-bottom: 16px;
}

/* Linhas de endereço (numeradas) */
.address-cards { display: flex; flex-direction: column; gap: 12px; }
.address-card {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) 118px 36px;
  gap: 10px; align-items: center;
}
.address-num {
  font-family: var(--font-brand);
  font-size: 15px; font-weight: 800;
  color: var(--accent);
  text-align: right;
}

/* Inputs */
input[type=text], input[type=number], select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}
input::placeholder { color: var(--muted); }
input:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(255,102,0,.15);
}
select { cursor: pointer; }

/* Botões de ação da busca */
.actions-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  padding: 11px 16px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  background: var(--accent); color: #fff;
  box-shadow: var(--shadow-btn);
  transition: background .15s, transform .1s;
}
.btn:hover  { background: var(--accent2); }
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--surface2); color: var(--text); border-color: var(--border); box-shadow: none; }
.btn.secondary:hover { background: var(--surface3); }

/* + Adicionar endereço (link) */
.add-link {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: none; padding: 0;
  color: var(--accent);
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  margin-top: 14px;
}

/* Remover linha (x) */
.btn-remove {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; line-height: 1;
  transition: background .15s, color .15s, border-color .15s;
}
.btn-remove:hover { color: var(--accent); border-color: var(--accent); }

/* ── STATS BAR ──────────────────────────────── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  padding: 0;
  background: transparent;
  border: none;
}
.stat {
  display: flex; flex-direction: column; gap: 2px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.stat-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.stat-value { font-size: 18px; font-weight: 700; }
.stat-value.accent { color: var(--accent); }
.stat-value.success { color: var(--success); }
.stats-bar .sep { display: none; }

/* ── RESULTS TABLE ──────────────────────────── */
.results-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.table-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
  background: var(--surface2);
}
.table-header h3 { font-size: 14px; font-weight: 700; flex: 1; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  table-layout: auto;
  min-width: 900px;
}
/* Minimum column widths — expand naturally with screen */
thead th:nth-child(1)  { min-width: 90px;  } /* Data */
thead th:nth-child(2)  { min-width: 160px; } /* Rua */
thead th:nth-child(3)  { min-width: 55px;  } /* Nº */
thead th:nth-child(4)  { min-width: 110px; } /* Complemento */
thead th:nth-child(5)  { min-width: 110px; } /* Bairro */
thead th:nth-child(6)  { min-width: 130px; } /* Edifício */
thead th:nth-child(7)  { min-width: 70px;  } /* A.C. */
thead th:nth-child(8)  { min-width: 120px; } /* Valor */
thead th:nth-child(9)  { min-width: 100px; } /* R$/m² */
thead th:nth-child(10) { min-width: 75px;  } /* Cartório */
thead th:nth-child(11) { min-width: 110px; } /* Matrícula */
thead th:nth-child(12) { min-width: 70px;  } /* SQL */
thead th {
  background: var(--surface2);
  padding: 8px 12px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  transition: background .15s, color .15s;
}
thead th:hover { background: var(--surface3); color: var(--text); }
thead th.sorted { color: var(--accent); }
thead th .sort-icon { margin-left: 4px; opacity: .5; }
thead th.sorted .sort-icon { opacity: 1; }

/* Separadores verticais contínuos entre colunas (grade completa) */
thead th, tbody td { border-right: 2px solid var(--sep-line); }
thead th:last-child, tbody td:last-child { border-right: none; }

.filter-row th {
  background: var(--surface2);
  padding: 4px 6px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 33px;
}
.filter-row th input {
  padding: 5px 8px;
  font-size: 12px;
  border-radius: 5px;
  width: 100%;
  min-width: 0;
}

tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
tbody td {
  padding: 10px 12px;
  vertical-align: middle;
  white-space: nowrap;
  max-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
td.val-money { font-weight: 700; color: var(--success); }
td.val-m2    { color: var(--accent); font-weight: 600; }
td.val-date  { color: var(--muted); font-size: 12px; }
td.tag {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
}

.empty-state {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }

/* ── MOBILE ──────────────────────────────────── */
@media (max-width: 640px) {
  :root { --header-h: 54px; }
  main { padding: 12px; gap: 12px; }
  .search-panel { padding: 16px; }
  .address-card { grid-template-columns: 20px minmax(0, 1fr) 84px 34px; gap: 8px; }
  .btn-remove { width: 34px; height: 34px; }
  .stats-bar { grid-template-columns: 1fr 1fr; }
  .stat-value { font-size: 15px; }
  .logo { font-size: 15px; }
  thead th, tbody td { padding: 7px 9px; font-size: 12px; }
}
@media (max-width: 400px) {
  .stats-bar { grid-template-columns: 1fr; }
}

/* ── RESULT CARDS (mobile) ───────────────────── */
.mobile-cards-view {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
}
.result-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow-card);
}
.result-card-addr {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}
.result-card-comp {
  font-size: 12px;
  color: var(--muted);
  margin-top: -4px;
}
.result-card-edificio {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
}
.result-card-values {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  background: var(--surface);
  border-radius: 8px;
  padding: 10px;
  margin: 2px 0;
}
.result-card-val {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.result-card-val-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--muted);
}
.result-card-val-num {
  font-size: 13px;
  font-weight: 700;
}
.result-card-val-num.money { color: var(--success); }
.result-card-val-num.m2    { color: var(--accent); }
.result-card-footer {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-top: 4px;
  border-top: 1px solid var(--border);
}
.result-card-tag {
  font-size: 11px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 2px 7px;
}

/* ── AUTOCOMPLETE ───────────────────────────── */
.autocomplete-wrapper { position: relative; flex: 1; min-width: 0; }
.autocomplete-wrapper.input-num { flex: 0 0 90px; }
.autocomplete-list {
  position: absolute;
  top: calc(100% + 2px); left: 0; right: 0;
  z-index: 500;
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 0 0 9px 9px;
  max-height: 220px;
  overflow-y: auto;
  box-shadow: 0 6px 20px rgba(0,0,0,.5);
}
.autocomplete-item {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  transition: background .1s, color .1s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover, .autocomplete-item.active {
  background: var(--accent);
  color: #fff;
}
.btn-clear {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.btn-clear:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-export {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--success);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 7px 16px;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-export:hover { opacity: .85; }
/* ── COL RESIZE ─────────────────────────────────────────────────── */
thead th {
  position: relative;
}
.col-resize-handle {
  position: absolute;
  top: 0; right: 0;
  width: 5px; height: 100%;
  cursor: col-resize;
  user-select: none;
  z-index: 1;
}
.col-resize-handle:hover,
.col-resize-active {
  background: var(--accent);
  opacity: .5;
}
/* ── UTIL ────────────────────────────────────── */
.hidden { display: none !important; }
.chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  background: rgba(255,102,0,.15);
  color: var(--accent);
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <h2>Vendidos ITBI</h2>
  <p id="loadingMsg">Inicializando...</p>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7.5 12 3l9 4.5" />
        <path d="M5 10.5v7a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 17.5v-7" />
        <path d="M8.5 19v-5h7v5" />
      </svg>
      <span>Pandora</span> Vendidos
    </div>
    <span class="badge">ITBI SP</span>
    <button class="btn-icon" id="btnTheme" title="Alternar tema" onclick="toggleTheme()" aria-label="Alternar tema">
      <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v2" />
        <path d="M12 19v2" />
        <path d="M4.93 4.93l1.41 1.41" />
        <path d="M17.66 17.66l1.41 1.41" />
        <path d="M3 12h2" />
        <path d="M19 12h2" />
        <path d="M4.93 19.07l1.41-1.41" />
        <path d="M17.66 6.34l1.41-1.41" />
        <circle cx="12" cy="12" r="4" />
      </svg>
    </button>
  </header>

  <main>

    <!-- SEARCH -->
    <div class="search-panel">
      <h1 class="search-title">Busca por endereço</h1>
      <div class="address-cards" id="addressCards"></div>
      <button class="add-link" onclick="addAddressCard()">+ Adicionar endereço</button>
      <div class="actions-row">
        <button class="btn secondary" onclick="clearSearch()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          <span>Limpar</span>
        </button>
        <button class="btn" onclick="doSearch()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m20 20-4.2-4.2" /></svg>
          <span>Buscar</span>
        </button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-bar hidden" id="statsBar">
      <div class="stat">
        <span class="stat-label">Resultados</span>
        <span class="stat-value accent" id="statTotal">—</span>
      </div>
      <div class="sep"></div>
      <div class="stat">
        <span class="stat-label">Ticket Médio</span>
        <span class="stat-value" id="statMedia">—</span>
      </div>
      <div class="sep"></div>
      <div class="stat">
        <span class="stat-label">Mais recente</span>
        <span class="stat-value" id="statRecente">—</span>
      </div>
      <div class="sep"></div>
      <div class="stat">
        <span class="stat-label">Mais antiga</span>
        <span class="stat-value" id="statAntiga">—</span>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="results-panel hidden" id="resultsPanel">
      <div class="table-header">
        <h3 id="resultsTitle">Resultados</h3>
        <button class="btn-export hidden" id="btnExport" onclick="exportCSV()" title="Exportar para planilha">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10" /><path d="m8 9 4 4 4-4" /><path d="M5 15v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" /></svg>
          <span>Exportar</span>
        </button>
      </div>
      <div class="table-wrap">
        <table id="resultsTable">
          <thead>
            <tr id="headerRow"></tr>
            <tr class="filter-row" id="filterRow"></tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
      <div class="empty-state hidden" id="emptyState">
        <div class="icon"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
        <h3>Nenhum resultado encontrado</h3>
        <p>Tente buscar por outros endereços ou ampliar o período.</p>
      </div>
    </div>

  </main>
</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────
const DB_URL = './ITBI_SP_residencial.db.gz';
const COLS = [
  { key: 'data_transacao',    label: 'Data',       fmt: 'date'  },
  { key: 'logradouro',        label: 'Rua',        fmt: 'text'  },
  { key: 'numero',            label: 'Nº',         fmt: 'text'  },
  { key: 'complemento',       label: 'Complemento',fmt: 'text'  },
  { key: 'bairro',            label: 'Bairro',     fmt: 'text'  },
  { key: 'referencia',        label: 'Edifício',   fmt: 'text'  },
  { key: 'area_construida_m2',label: 'A.C. (m²)',  fmt: 'num'   },
  { key: 'valor_transacao',   label: 'Valor',      fmt: 'money' },
  { key: 'valor_m2',          label: 'R$/m²',      fmt: 'money' },
  { key: 'cartorio',          label: 'Cartório',   fmt: 'cartorio' },
  { key: 'matricula',         label: 'Matrícula',  fmt: 'text'  },
  { key: 'sql',               label: 'SQL',        fmt: 'text'  },
];

// ─── STATE ─────────────────────────────────────────────────────────
let db = null;
let colWidths = {}; // user-set column widths in px
let allResults = [];
let filteredResults = [];
let sortCol = 'data_transacao';
let sortDir = 'DESC';
let cardCount = 0;
let colFilters = {};

// ─── INIT ───────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  addAddressCard();
  applyThemeIcon();
  await loadDatabase();
});

async function loadDatabase() {
  try {
    setProgress(5, 'Carregando motor SQL...');
    const SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
    });

    setProgress(20, 'Baixando banco de dados (47 MB)...');
    const res = await fetch(DB_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const total = parseInt(res.headers.get('content-length') || '0');
    let received = 0;
    const chunks = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (total > 0) {
        const pct = 20 + Math.round((received / total) * 50);
        setProgress(pct, `Baixando... ${Math.round(received/1024/1024)}MB de ${Math.round(total/1024/1024)}MB`);
      }
    }

    setProgress(72, 'Descomprimindo...');
    const compressed = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) { compressed.set(chunk, offset); offset += chunk.length; }
    const decompressed = pako.inflate(compressed);

    setProgress(90, 'Preparando banco...');
    db = new SQL.Database(decompressed);

    setProgress(100, 'Pronto!');
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');

      // DB sanity check
      try {
        var ts = db.prepare('SELECT COUNT(*) as n FROM vendas');
        ts.step(); var cnt = ts.getAsObject(); ts.free();
        console.log('DB OK, total rows:', cnt.n);
      } catch(e) { console.error('DB check failed:', e); }

    }, 400);

  } catch (e) {
    document.getElementById('loadingMsg').textContent = 'Erro: ' + e.message;
    document.getElementById('loadingMsg').style.color = '#ef4444';
    console.error(e);
  }
}

function setProgress(pct, msg) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('loadingMsg').textContent = msg;
}

// ─── THEME ─────────────────────────────────────────────────────────
var ICON_SUN  = '<path d="M12 3v2"/><path d="M12 19v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M3 12h2"/><path d="M19 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/><circle cx="12" cy="12" r="4"/>';
var ICON_MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function applyThemeIcon() {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  var el = document.getElementById('themeIcon');
  if (el) el.innerHTML = dark ? ICON_SUN : ICON_MOON;
  document.getElementById('themeColor').content = dark ? '#0f0f0f' : '#ffffff';
}
function toggleTheme() {
  var html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  applyThemeIcon();
}

// ─── ADDRESS CARDS ──────────────────────────────────────────────────
function addAddressCard() {
  cardCount++;
  const id = cardCount;
  const container = document.getElementById('addressCards');
  const card = document.createElement('div');
  card.className = 'address-card';
  card.id = `card-${id}`;
  card.innerHTML = `
    <span class="address-num"></span>
    <div class="autocomplete-wrapper">
      <input type="text" id="rua-${id}" placeholder="Logradouro (ex: Alameda Tietê)" autocomplete="off" spellcheck="false" style="width:100%">
      <div class="autocomplete-list hidden" id="ac-rua-${id}"></div>
    </div>
    <div class="autocomplete-wrapper">
      <input type="text" id="num-${id}" placeholder="Número" autocomplete="off" style="width:100%">
      <div class="autocomplete-list hidden" id="ac-num-${id}"></div>
    </div>
    <button class="btn-remove" onclick="removeCard(${id})" title="Remover">×</button>`;
  container.appendChild(card);
  renumberCards();
  document.getElementById(`rua-${id}`).focus();
  setupCardAutocomplete(id);
}

function renumberCards() {
  document.querySelectorAll('#addressCards .address-card').forEach(function(card, i) {
    var n = card.querySelector('.address-num');
    if (n) n.textContent = (i + 1) + '.';
  });
}

function removeCard(id) {
  const cards = document.querySelectorAll('.address-card');
  if (cards.length <= 1) return;
  document.getElementById(`card-${id}`)?.remove();
  renumberCards();
}

// ─── AUTOCOMPLETE ───────────────────────────────────────────────────
let acDebounce = {};

function showDropdown(listEl, items, onSelect) {
  closeAllDropdowns();
  if (!items || items.length === 0) return;
  listEl.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'autocomplete-item';
    div.textContent = item;
    div.addEventListener('mousedown', e => { e.preventDefault(); onSelect(item); closeAllDropdowns(); });
    listEl.appendChild(div);
  });
  listEl.classList.remove('hidden');
}

function closeAllDropdowns() {
  document.querySelectorAll('.autocomplete-list').forEach(el => el.classList.add('hidden'));
}

document.addEventListener('click', e => {
  if (!e.target.closest('.autocomplete-wrapper')) closeAllDropdowns();
});

function queryDB(sql, params) {
  if (!db) return [];
  try {
    var stmt = db.prepare(sql);
    stmt.bind(params);
    var rows = [];
    while (stmt.step()) {
      var r = stmt.getAsObject();
      var v = Object.values(r)[0];
      if (v !== null && v !== undefined && v !== '') rows.push(v);
    }
    stmt.free();
    return rows;
  } catch(e) {
    console.warn('queryDB error:', e.message, '|', sql);
    return [];
  }
}

function setupCardAutocomplete(id) {
  const ruaEl = document.getElementById(`rua-${id}`);
  const numEl = document.getElementById(`num-${id}`);
  const ruaList = document.getElementById(`ac-rua-${id}`);
  const numList = document.getElementById(`ac-num-${id}`);

  ruaEl.addEventListener('input', () => {
    clearTimeout(acDebounce[`rua-${id}`]);
    acDebounce[`rua-${id}`] = setTimeout(() => {
      const val = ruaEl.value.trim();
      if (val.length < 2) { closeAllDropdowns(); return; }
      const norm = normalizeLogradouro(val);
      const items = queryDB(
        `SELECT DISTINCT logradouro_norm FROM vendas WHERE logradouro_norm LIKE ? ORDER BY logradouro_norm LIMIT 15`,
        [`%${norm}%`]
      );
      showDropdown(ruaList, items, chosen => {
        ruaEl.value = chosen;
        numEl.focus();
        const nums = queryDB(
          `SELECT DISTINCT numero FROM vendas WHERE logradouro_norm=? ORDER BY CAST(numero AS INTEGER) LIMIT 30`,
          [chosen]
        );
        showDropdown(numList, nums, n => { numEl.value = n; doSearch(); });
      });
    }, 220);
  });

  ruaEl.addEventListener('keydown', e => { if (e.key === 'Enter') { closeAllDropdowns(); doSearch(); } });

  numEl.addEventListener('focus', () => {
    const street = ruaEl.value.trim();
    if (!street || numEl.value) return;
    const nums = queryDB(
      `SELECT DISTINCT numero FROM vendas WHERE logradouro_norm=? ORDER BY CAST(numero AS INTEGER) LIMIT 30`,
      [normalizeLogradouro(street)]
    );
    showDropdown(numList, nums, n => { numEl.value = n; doSearch(); });
  });

  numEl.addEventListener('input', () => {
    clearTimeout(acDebounce[`num-${id}`]);
    acDebounce[`num-${id}`] = setTimeout(() => {
      const street = ruaEl.value.trim();
      const val = numEl.value.trim();
      if (!val) return;
      const items = queryDB(
        `SELECT DISTINCT numero FROM vendas WHERE logradouro_norm LIKE ? AND numero LIKE ? ORDER BY CAST(numero AS INTEGER) LIMIT 20`,
        [`%${normalizeLogradouro(street)}%`, `${val}%`]
      );
      showDropdown(numList, items, n => { numEl.value = n; doSearch(); });
    }, 200);
  });

  numEl.addEventListener('keydown', e => { if (e.key === 'Enter') { closeAllDropdowns(); doSearch(); } });
}

function setupSimpleAutocomplete(inputId, listId, getSql, transform) {
  const el = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!el || !list) return;
  el.addEventListener('input', () => {
    clearTimeout(acDebounce[inputId]);
    acDebounce[inputId] = setTimeout(() => {
      const val = el.value.trim();
      if (val.length < 2) { closeAllDropdowns(); return; }
      const norm = removeAccents(val.toUpperCase());
      const items = queryDB(getSql(norm), [`%${norm}%`]);
      showDropdown(list, items, chosen => { el.value = chosen; });
    }, 220);
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { closeAllDropdowns(); doSearch(); } });
}

// ─── NORMALIZE ──────────────────────────────────────────────────────
function removeAccents(str) {
  var norm = str.normalize('NFD');
  return norm.replace(/[\u0300-\u036f]/g, '');
}

function normalizeStreet(input) {
  // Uppercase + remove accents (legado — mantido para compatibilidade)
  let s = removeAccents(input.trim().toUpperCase());
  const prefixes = [
    'ALAMEDA','AVENIDA','TRAVESSA','ESTRADA','RODOVIA','PRACA','LARGO','RUA',
    'AL','AV','EST','TV','PC','R'
  ];
  for (const p of prefixes) {
    const re = new RegExp('^' + p + '\\s+');
    if (re.test(s)) { s = s.replace(re, '').trim(); break; }
  }
  return s;
}

// Normaliza logradouro igual ao banco (logradouro_norm)
const _NORM_MAP = [
  [/^R\b/,'RUA'],[/^AV\b/,'AVENIDA'],[/^AL\b/,'ALAMEDA'],[/^PC\b/,'PRACA'],
  [/^PCA\b/,'PRACA'],[/^TV\b/,'TRAVESSA'],[/^EST\b/,'ESTRADA'],[/^RD\b/,'RODOVIA'],
  [/^VL\b/,'VILA'],[/\bENG\b/g,'ENGENHEIRO'],[/\bDR\b/g,'DOUTOR'],[/\bDRA\b/g,'DOUTORA'],
  [/\bPROF\b/g,'PROFESSOR'],[/\bPROFA\b/g,'PROFESSORA'],[/\bPDE\b/g,'PADRE'],
  [/\bCEL\b/g,'CORONEL'],[/\bBRIG\b/g,'BRIGADEIRO'],[/\bBR\b/g,'BARAO'],
  [/\bCONS\b/g,'CONSELHEIRO'],[/\bMAL\b/g,'MARECHAL'],[/\bGEN\b/g,'GENERAL'],
  [/\bGOV\b/g,'GOVERNADOR'],[/\bDEP\b/g,'DEPUTADO'],[/\bSEN\b/g,'SENADOR'],
  [/\bVER\b/g,'VEREADOR'],[/\bPRES\b/g,'PRESIDENTE'],[/\bSTA\b/g,'SANTA'],
  [/\bSTO\b/g,'SANTO'],[/\bDES\b/g,'DESEMBARGADOR'],[/\bMIN\b/g,'MINISTRO'],
  [/\bCOM\b/g,'COMENDADOR'],
];
function normalizeLogradouro(s) {
  if (!s) return s;
  s = removeAccents(s.trim().toUpperCase()).replace(/\s+/g,' ');
  for (const [p,r] of _NORM_MAP) s = s.replace(p, r);
  return s;
}

// ─── SEARCH ─────────────────────────────────────────────────────────
function doSearch() {
  if (!db) return;

  // Collect address cards
  const addresses = [];
  document.querySelectorAll('.address-card').forEach(card => {
    const id = card.id.replace('card-', '');
    const rua = document.getElementById(`rua-${id}`)?.value?.trim() || '';
    const num = document.getElementById(`num-${id}`)?.value?.trim() || '';
    if (rua) addresses.push({ rua, num });
  });

  if (addresses.length === 0) {
    alert('Digite pelo menos um endereço para buscar.');
    return;
  }

  // Build WHERE clause with positional ? params
  const conditions = [];
  const params = [];

  var searchClauses = [];
  addresses.forEach(function(a) {
    const normalized = normalizeLogradouro(a.rua);
    params.push('%' + normalized + '%');
    let clause = 'logradouro_norm LIKE ?';
    if (a.num) {
      params.push(a.num.trim());
      clause += ' AND numero LIKE ?';
    }
    searchClauses.push('(' + clause + ')');
  });
  if (searchClauses.length > 0) {
    conditions.push('(' + searchClauses.join(' OR ') + ')');
  }

  var sql = 'SELECT sql, data_transacao, logradouro, numero, complemento, bairro, ' +
    'referencia, area_construida_m2, ' +
    'valor_transacao, valor_m2, cartorio, matricula ' +
    'FROM vendas WHERE ' + conditions.join(' AND ') +
    ' ORDER BY data_transacao DESC LIMIT 2000';

  console.log('SQL:', sql);
  console.log('PARAMS:', JSON.stringify(params));

  try {
    var stmt = db.prepare(sql);
    stmt.bind(params);
    allResults = [];
    while (stmt.step()) allResults.push(stmt.getAsObject());
    stmt.free();
    console.log('Results found:', allResults.length);
  } catch (e) {
    console.error('SQL Error:', e.message);
    alert('Erro na consulta: ' + e.message);
    return;
  }

  colFilters = {};
  filteredResults = [...allResults];
  renderStats();
  renderTable();
}

// ─── STATS ──────────────────────────────────────────────────────────
function renderStats() {
  const data = filteredResults;
  document.getElementById('statsBar').classList.toggle('hidden', data.length === 0);
  if (data.length === 0) return;

  document.getElementById('statTotal').textContent = data.length.toLocaleString('pt-BR');

  const vals = data.filter(r => r.valor_transacao > 0).map(r => r.valor_transacao);
  const media = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
  document.getElementById('statMedia').textContent = formatMoney(media);

  const dates = data.filter(r => r.data_transacao).map(r => r.data_transacao).sort();
  document.getElementById('statRecente').textContent = dates.length ? formatDate(dates[dates.length - 1]) : '—';
  document.getElementById('statAntiga').textContent  = dates.length ? formatDate(dates[0]) : '—';
}

// ─── TABLE ──────────────────────────────────────────────────────────
function renderTable() {
  const panel = document.getElementById('resultsPanel');
  const empty = document.getElementById('emptyState');
  panel.classList.remove('hidden');
  var exportBtn = document.getElementById('btnExport');
  var hasResults = filteredResults.length > 0;
  if (exportBtn) exportBtn.classList.toggle('hidden', !hasResults);

  document.getElementById('resultsTitle').textContent =
    `${filteredResults.length.toLocaleString('pt-BR')} resultado${filteredResults.length !== 1 ? 's' : ''}` +
    (filteredResults.length < allResults.length ? ` (filtrado de ${allResults.length.toLocaleString('pt-BR')})` : '');

  // Use card layout on mobile
  if (window.innerWidth <= 640) {
    renderCards();
    return;
  }

  // Hide cards view if switching back to desktop
  var existing = document.querySelector('.mobile-cards-view');
  if (existing) existing.remove();
  document.querySelector('.table-wrap').style.display = '';

  // Helper para preferir logradouro_fmt se existir
  function getCellValue(row, key) {
    if (key === 'logradouro') {
      if (row.logradouro_fmt && String(row.logradouro_fmt).trim()) return row.logradouro_fmt;
      return row.logradouro || '—';
    }
    return row[key];
  }

  // Header
  const headerRow = document.getElementById('headerRow');
  headerRow.innerHTML = COLS.map(c => {
    const isSorted = sortCol === c.key;
    const icon = isSorted ? (sortDir === 'ASC' ? '↑' : '↓') : '↕';
    return `<th onclick="sortBy('${c.key}')" class="${isSorted ? 'sorted' : ''}">
      ${c.label} <span class="sort-icon">${icon}</span>
    </th>`;
  }).join('');

  // Filter row
  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = COLS.map(c =>
    `<th><input type="text" placeholder="Filtrar" value="${colFilters[c.key] || ''}"
      oninput="applyColFilter('${c.key}', this.value)" style="min-width:55px;"></th>`
  ).join('');

  // Body
  const tbody = document.getElementById('resultsBody');
  if (filteredResults.length === 0) {
    empty.classList.remove('hidden');
    tbody.innerHTML = '';
    return;
  }
  empty.classList.add('hidden');

  const rows = filteredResults.map(row => {
    const cells = COLS.map(c => {
      const v = getCellValue(row, c.key);
      if (v === null || v === undefined || v === '') return `<td class="tag">—</td>`;
      switch (c.fmt) {
        case 'date':  return `<td class="val-date">${formatDate(v)}</td>`;
        case 'money': return `<td class="val-money">${formatMoney(v)}</td>`;
        case 'num':   return `<td>${v ? Number(v).toLocaleString('pt-BR') : '—'}</td>`;
        case 'cartorio': return `<td class="tag">${shortCartorio(v)}</td>`;
        default:      return `<td>${v}</td>`;
      }
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  tbody.innerHTML = rows;
  setupColResize();
}

// ─── CARDS (mobile) ──────────────────────────────────────────────────
function renderCards() {
  // Hide table
  document.querySelector('.table-wrap').style.display = 'none';
  document.getElementById('headerRow').innerHTML = '';
  document.getElementById('filterRow').innerHTML = '';
  document.getElementById('resultsBody').innerHTML = '';

  // Remove old cards view
  var old = document.querySelector('.mobile-cards-view');
  if (old) old.remove();

  const empty = document.getElementById('emptyState');
  if (filteredResults.length === 0) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  var container = document.createElement('div');
  container.className = 'mobile-cards-view';

  filteredResults.forEach(function(row) {
    var addr = (row.logradouro_fmt && String(row.logradouro_fmt).trim()) ? row.logradouro_fmt : (row.logradouro || '—');
    if (row.numero) addr += ', ' + row.numero;
    var comp = '';
    if (row.complemento) comp += row.complemento;
    if (row.bairro) comp += (comp ? ' · ' : '') + row.bairro;

    var edificio = row.referencia || '';
    var area = row.area_construida_m2 ? Number(row.area_construida_m2).toLocaleString('pt-BR') + ' m²' : '—';
    var valor = row.valor_transacao ? formatMoney(row.valor_transacao) : '—';
    var vm2 = row.valor_m2 ? formatMoney(row.valor_m2) : '—';
    var data = row.data_transacao ? formatDate(row.data_transacao) : '—';
    var cart = row.cartorio ? shortCartorio(row.cartorio) : '';
    var mat = row.matricula || '';
    var sql = row.sql || '';

    var card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML =
      '<div class="result-card-addr">' + addr + '</div>' +
      (comp ? '<div class="result-card-comp">' + comp + '</div>' : '') +
      (edificio ? '<div class="result-card-edificio">' + edificio + '</div>' : '') +
      '<div class="result-card-values">' +
        '<div class="result-card-val">' +
          '<span class="result-card-val-label">Área</span>' +
          '<span class="result-card-val-num">' + area + '</span>' +
        '</div>' +
        '<div class="result-card-val">' +
          '<span class="result-card-val-label">Valor</span>' +
          '<span class="result-card-val-num money">' + valor + '</span>' +
        '</div>' +
        '<div class="result-card-val">' +
          '<span class="result-card-val-label">R$/m²</span>' +
          '<span class="result-card-val-num m2">' + vm2 + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="result-card-footer">' +
        '<span class="result-card-tag">' + data + '</span>' +
        (cart ? '<span class="result-card-tag">' + cart + '</span>' : '') +
        (mat ? '<span class="result-card-tag">Mat. ' + mat + '</span>' : '') +
        (sql ? '<span class="result-card-tag">SQL ' + sql + '</span>' : '') +
      '</div>';

    container.appendChild(card);
  });

  document.getElementById('resultsPanel').appendChild(container);
}

function applyColFilter(key, val) {
  colFilters[key] = val.trim().toUpperCase();
  filteredResults = allResults.filter(row =>
    Object.entries(colFilters).every(([k, v]) => {
      if (!v) return true;
      const cell = String(row[k] ?? '').toUpperCase();
      return cell.includes(v);
    })
  );
  renderStats();
  renderTable();
}

function sortBy(key) {
  if (sortCol === key) {
    sortDir = sortDir === 'DESC' ? 'ASC' : 'DESC';
  } else {
    sortCol = key;
    sortDir = 'DESC';
  }
  const col = COLS.find(c => c.key === key);
  filteredResults.sort((a, b) => {
    let va = a[key] ?? '', vb = b[key] ?? '';
    if (col?.fmt === 'money' || col?.fmt === 'num') {
      va = parseFloat(va) || 0;
      vb = parseFloat(vb) || 0;
    } else {
      va = String(va).toLowerCase();
      vb = String(vb).toLowerCase();
    }
    if (va < vb) return sortDir === 'ASC' ? -1 : 1;
    if (va > vb) return sortDir === 'ASC' ? 1 : -1;
    return 0;
  });
  renderTable();
}

// ─── COLUMN RESIZE ───────────────────────────────────────────────────
function setupColResize() {
  var headerRow = document.getElementById('headerRow');
  if (!headerRow) return;
  var ths = headerRow.querySelectorAll('th');
  ths.forEach(function(th, i) {
    // Apply saved width
    if (colWidths[i]) th.style.width = colWidths[i] + 'px';
    // Remove old handle if any
    var old = th.querySelector('.col-resize-handle');
    if (old) old.remove();
    // Add handle
    var handle = document.createElement('span');
    handle.className = 'col-resize-handle';
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      var startX = e.pageX;
      var startW = th.offsetWidth;
      handle.classList.add('col-resize-active');
      function onMove(e) {
        var w = Math.max(40, startW + e.pageX - startX);
        th.style.width = w + 'px';
        colWidths[i] = w;
      }
      function onUp() {
        handle.classList.remove('col-resize-active');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    th.appendChild(handle);
  });
}

// ─── CLEAR ──────────────────────────────────────────────────────────
function clearSearch() {
  // Volta as linhas de endereço para uma só
  document.getElementById('addressCards').innerHTML = '';
  cardCount = 0;
  addAddressCard();
  // Esconde resultados
  document.getElementById('resultsPanel').classList.add('hidden');
  document.getElementById('statsBar').classList.add('hidden');
  var exp = document.getElementById('btnExport');
  if (exp) exp.classList.add('hidden');
  allResults = []; filteredResults = [];
}

// ─── EXPORT ─────────────────────────────────────────────────────────
function exportCSV() {
  if (!filteredResults.length) return;
  var BOM = '﻿'; // UTF-8 BOM for Excel
  var headers = COLS.map(function(c) { return '"' + c.label + '"'; }).join(';');
  var rows = filteredResults.map(function(row) {
    return COLS.map(function(col) {
      var v = row[col.key];
      if (v === null || v === undefined) return '';
      if (col.fmt === 'date') return formatDate(v);
      if (col.fmt === 'money') return String(v).replace('.', ',');
      if (col.fmt === 'num')   return String(v || '').replace('.', ',');
      if (col.fmt === 'cartorio') return shortCartorio(v);
      if (col.fmt === 'tag')   return shortIptu(v);
      return '"' + String(v).replace(/"/g, '""') + '"';
    }).join(';');
  });
  var csv = BOM + headers + '\n' + rows.join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var now = new Date();
  var ts = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0');
  a.download = 'ITBI_Vendidos_' + ts + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── FORMAT ─────────────────────────────────────────────────────────
function formatDate(v) {
  if (!v) return '—';
  const d = String(v).slice(0, 10);
  const [y, m, dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}

function formatMoney(v) {
  if (!v || isNaN(v)) return '—';
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function shortCartorio(v) {
  if (!v) return '—';
  // "5º Cartório de Registro de Imóvel" → "5º CRI"
  var m = v.match(/^(\d+)[ºª°]?/);
  if (m) return m[1] + 'º CRI';
  if (v.toLowerCase().includes('cartório')) return 'CRI';
  return v.slice(0, 6);
}

function shortIptu(v) {
  if (!v) return '—';
  if (v.includes('APARTAMENTO')) return 'APARTAMENTO';
  if (v.includes('GARAGEM')) return 'GARAGEM';
  if (v.includes('RESIDÊNCIA COLETIVA')) return 'RES. COLETIVA';
  if (v.includes('FLAT')) return 'FLAT';
  if (v.includes('RESIDÊNCIA')) return 'RESIDÊNCIA';
  return v.slice(0, 12);
}
